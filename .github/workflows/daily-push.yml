name: Economist Daily Push

on:
  schedule:
    - cron: '0 0 * * 0-5'  # Sun-Fri 00:00 UTC = 08:00 CST
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run daily push
        run: node scripts/daily-push.js
      - name: Commit schedule
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/schedule.json
          git diff --cached --quiet || git commit -m "daily: mark batch sent"
          git push