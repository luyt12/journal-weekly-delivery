name: Journal Weekly Delivery

on:
  workflow_dispatch:
    inputs:
      magazine:
        description: 'Magazine to fetch (economist, new_yorker, atlantic, wired)'
        required: true
        type: choice
        options:
          - economist
          - new_yorker
          - atlantic
          - wired
      date:
        description: 'Specific issue date (e.g. 2026.05.25). Leave empty for latest unfetched.'
        required: false
        type: string
      push:
        description: 'Send to Feishu immediately after fetching?'
        required: false
        type: boolean
        default: true

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install jszip
      - name: Fetch and split magazine
        run: |
          ARGS="${{ github.event.inputs.magazine }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS ${{ github.event.inputs.date }}"
          fi
          node scripts/deliver.js $ARGS
      - name: Commit fetched data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/schedule.json data/fetched.json
          git diff --cached --quiet || git commit -m "fetched: ${{ github.event.inputs.magazine }} issue"
          git push
      - name: Push to Feishu
        if: ${{ github.event.inputs.push == 'true' }}
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
        run: |
          MAG="${{ github.event.inputs.magazine }}"
          # Extract issue date from schedule.json
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(node -e "const s=JSON.parse(require('fs').readFileSync('data/schedule.json','utf8'));const m=s.magazines[MAG];if(!m)process.exit(1);const dates=Object.keys(m).sort().reverse();console.log(dates[0])" 2>/dev/null)
          fi
          if [ -n "$DATE" ]; then
            node scripts/daily-push.js "$MAG" "$DATE"
          else
            echo "Could not determine issue date"
          fi
      - name: Commit sent status
        if: ${{ github.event.inputs.push == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/schedule.json
          git diff --cached --quiet || git commit -m "sent: ${{ github.event.inputs.magazine }}"
          git push
