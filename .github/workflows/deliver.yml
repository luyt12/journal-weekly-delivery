name: Economist Weekly - Saturday Extract

on:
  schedule:
    - cron: '0 0 * * 6'   # Saturday 00:00 UTC = 08:00 CST
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install jszip
      - name: Run deliver script
        run: node scripts/deliver.js
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "weekly: split EPUB into daily batches"
          git push
